media:
  input: media
  output: /Orsini/media
content:
  - name: inici
    label: Portada
    type: file
    path: content/inici.json
    format: json
    fields:
      - name: titular
        label: Titular principal
        type: string
      - name: introduccio
        label: Text de presentació
        type: text
      - name: nota_cursos
        label: Nota sobre els cursos
        type: text
  - name: centre
    label: El centre
    type: file
    path: content/centre.json
    format: json
    fields:
      - name: title
        label: Títol
        type: string
      - name: intro
        label: Introducció
        type: text
      - name: body
        label: Text del centre
        type: rich-text
  - name: participa
    label: Informació pràctica
    type: file
    path: content/participa.json
    format: json
    fields:
      - name: title
        label: Títol
        type: string
      - name: intro
        label: Introducció
        type: text
      - name: body
        label: Informació pràctica
        type: rich-text
  - name: cursos
    label: Cursos
    type: collection
    path: content/cursos
    format: json
    filename: "{primary}.json"
    view:
      primary: slug
      fields: [title, category, active]
    fields:
      - name: slug
        label: Identificador URL (sense espais ni accents)
        type: string
        required: true
      - name: title
        label: Títol
        type: string
        required: true
      - name: category
        label: Àmbit
        type: string
      - name: summary
        label: Resum
        type: text
      - name: illustration
        label: Il·lustració
        type: select
        options: [book, glasses, pencil, dialog, magnifier]
      - name: status
        label: Estat i convocatòria
        type: string
      - name: introduction
        label: Introducció de la capçalera
        type: text
      - name: practical
        label: Informació pràctica (D’un cop d’ull)
        type: rich-text
      - name: body
        label: Contingut del curs
        type: rich-text
      - name: gift_book_title
        label: Llibre de regal — Títol
        type: string
      - name: gift_book_author
        label: Llibre de regal — Autoria
        type: string
      - name: gift_book_publisher
        label: Llibre de regal — Editorial
        type: string
      - name: gift_book_cover
        label: Llibre de regal — Coberta
        type: image
      - name: active
        label: Visible al web
        type: boolean
      - name: image
        label: Imatge
        type: image
  - name: web
    label: Textos generals
    type: file
    path: content/web.json
    format: json
    fields:
      - name: brand
        label: Nom de la web
        type: string
      - name: subtitle
        label: Subtítol
        type: string
      - name: footer
        label: Peu de pàgina
        type: text
      - name: program_intro
        label: Introducció al programa
        type: text
      - name: course_note
        label: Nota sobre els cursos
        type: text
      - name: test_notice
        label: Avís de matrícula de prova
        type: text
  - name: privacitat
    label: Política de privacitat
    type: file
    path: content/privacitat.json
    format: json
    fields:
      - name: title
        label: Títol
        type: string
      - name: body
        label: Contingut
        type: rich-text
  - name: cookies
    label: Política de cookies
    type: file
    path: content/cookies.json
    format: json
    fields:
      - name: title
        label: Títol
        type: string
      - name: body
        label: Contingut
        type: rich-text
  - name: avis-legal
    label: Avís legal
    type: file
    path: content/avis-legal.json
    format: json
    fields:
      - name: title
        label: Títol
        type: string
      - name: body
        label: Contingut
        type: rich-text
